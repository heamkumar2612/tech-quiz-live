<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Tech Quiz Host
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <div class="bg"></div>


  <main class="shell hostShell">


    <!-- =====================================================
         HOST AUTHENTICATION
    ====================================================== -->

    <section
      id="auth"
      class="card join"
    >


      <div class="badge">
        HOST CONTROL
      </div>


      <h1>
        Tech Quiz Live
      </h1>


      <input
        id="hostCode"
        placeholder="Quiz code"
        inputmode="numeric"
        autocomplete="off"
      >


      <button id="authBtn">
        OPEN CONTROL
      </button>


      <div
        id="authMsg"
        class="msg"
      ></div>


    </section>



    <!-- =====================================================
         HOST QUIZ CONTROL
    ====================================================== -->

    <section
      id="host"
      class="hidden"
    >


      <!-- HOST HEADER -->

      <header>


        <div>

          <b>
            HOST CONTROL
          </b>

          <span id="hostQnum">
            LOBBY
          </span>

        </div>


        <div class="score">

          <strong id="hostCount">
            0
          </strong>

          PLAYERS

        </div>


      </header>



      <!-- ===================================================
           HOST MAIN GRID
      ==================================================== -->

      <div class="hostGrid">


        <!-- QUESTION / PROJECTOR AREA -->

        <div class="questionCard">


          <div
            id="hostTimer"
            class="timer"
          >
            20
          </div>


          <h1 id="hostQuestion">
            Waiting for players...
          </h1>


          <!--
            Q1 - Q65:
            MCQ options appear here.

            Q66 - Q95:
            Scrambled word appears here.
          -->

          <div
            id="hostOptions"
            class="options hostOptions"
          ></div>


        </div>



        <!-- =================================================
             HOST SIDE PANEL
        ================================================== -->

        <div class="card side">


          <!-- TOP 5 -->

          <h2>
            Top 5
          </h2>


          <div id="top5"></div>



          <!-- JOINED PLAYER LIST -->

          <div id="playerManage">


            <h2>
              Joined Players
            </h2>


            <div id="hostPlayers">

              <p>
                No players joined
              </p>

            </div>


          </div>



          <!-- HOST CONTROLS -->

          <div class="controls">


            <button id="startBtn">
              START QUIZ
            </button>


            <button
              id="revealBtn"
              class="secondary"
            >
              REVEAL ANSWER
            </button>


            <button id="nextBtn">
              NEXT QUESTION
            </button>


            <button
              id="resetBtn"
              class="danger"
            >
              RESET QUIZ
            </button>


          </div>


        </div>


      </div>



      <!-- ===================================================
           TIMER BAR
      ==================================================== -->

      <div class="timerWrap">

        <div id="hostTimerBar"></div>

      </div>



      <!-- ===================================================
           HOST STATUS / ANTI-CHEAT ALERT
      ==================================================== -->

      <div
        id="hostStatus"
        class="status"
      ></div>


    </section>



    <!-- =====================================================
         FINAL LEADERBOARD
    ====================================================== -->

    <section
      id="hostFinal"
      class="card hidden"
    >


      <div class="badge">
        FINAL LEADERBOARD
      </div>


      <h1>
        🏆 Winners
      </h1>


      <div
        id="hostPodium"
        class="podium"
      ></div>


      <div id="hostRanking"></div>


      <button
        onclick="location.reload()"
      >
        BACK TO CONTROL
      </button>


    </section>


  </main>



  <!-- =======================================================
       SOCKET.IO
  ======================================================== -->

  <script src="/socket.io/socket.io.js"></script>



  <!-- =======================================================
       HOST APP
  ======================================================== -->

  <script src="host.js"></script>


</body>

</html>
