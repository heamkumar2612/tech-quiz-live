<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tech Quiz Host</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg"></div>

<main class="shell hostShell">

<section id="auth" class="card join">

<div class="badge">HOST CONTROL</div>

<h1>Tech Quiz Live</h1>

<input
 id="hostCode"
 placeholder="Quiz code"
 inputmode="numeric"
>

<button id="authBtn">
 OPEN CONTROL
</button>

<div id="authMsg" class="msg"></div>

</section>


<section id="host" class="hidden">

<header>

<div>
 <b>HOST CONTROL</b>
 <span id="hostQnum">LOBBY</span>
</div>

<div class="score">
 <strong id="hostCount">0</strong>
 PLAYERS
</div>

</header>


<div class="hostGrid">

<div class="questionCard">

<div id="hostTimer" class="timer">
 20
</div>

<h1 id="hostQuestion">
 Waiting for players...
</h1>

<div
 id="hostOptions"
 class="options hostOptions"
></div>

</div>


<div class="card side">

<h2>Top 5</h2>

<div id="top5"></div>


<!-- JOINED PLAYER LIST -->

<div id="playerManage">

<h2>Joined Players</h2>

<div id="hostPlayers">
 <p>No players joined</p>
</div>

</div>


<div class="controls">

<button id="startBtn">
 START QUIZ
</button>

<button
 id="revealBtn"
 class="secondary"
>
 REVEAL
</button>

<button id="nextBtn">
 NEXT QUESTION
</button>

<button
 id="resetBtn"
 class="danger"
>
 RESET
</button>

</div>

</div>

</div>


<div class="timerWrap">
 <div id="hostTimerBar"></div>
</div>

<div
 id="hostStatus"
 class="status"
></div>

</section>


<section
 id="hostFinal"
 class="card hidden"
>

<div class="badge">
 FINAL LEADERBOARD
</div>

<h1>🏆 Winners</h1>

<div
 id="hostPodium"
 class="podium"
></div>

<div id="hostRanking"></div>

<button onclick="location.reload()">
 BACK TO CONTROL
</button>

</section>

</main>


<script src="/socket.io/socket.io.js"></script>

<script src="host.js"></script>

</body>

</html>
